services:
  postgres:
    image: postgres:16-alpine
    container_name: product-api-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: product-api-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: productdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: my-super-secret-jwt-signing-key-that-is-at-least-256-bits-long-for-hs256
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      REQUIRE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
